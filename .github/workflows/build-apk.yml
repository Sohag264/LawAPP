name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-<not set>}"
          JAVA_VERSION_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | head -n 1)
          if [ -z "$JAVA_VERSION_STR" ]; then
            echo "::error::Could not detect active Java version."
            exit 1
          fi
          MAJOR_VER=$(echo "$JAVA_VERSION_STR" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse Java major version from '$JAVA_VERSION_STR'."
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, found Java $MAJOR_VER."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            KEYTOOL_BIN="keytool"
            if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
              KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            fi
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create temporary ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is empty."
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::$APK_PATH does not have the .apk extension."
            exit 1
          fi
          echo "Verified debug APK at $APK_PATH"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")"
          DEST_APK="${TEMP_DIR}/app-debug.apk"
          cp "$SRC_APK" "$DEST_APK"
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "::error::Prepared release APK missing or empty at $DEST_APK"
            exit 1
          fi
          echo "apk_path=${DEST_APK}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at ${DEST_APK}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_APK: ${{ steps.prepare_release_asset.outputs.apk_path }}
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not available."
            exit 1
          fi
          gh --version

          if [ -z "$PREPARED_APK" ] || [ ! -f "$PREPARED_APK" ] || [ ! -s "$PREPARED_APK" ]; then
            echo "::error::Prepared APK is missing or empty."
            exit 1
          fi
          if [[ "$PREPARED_APK" != *.apk ]]; then
            echo "::error::Prepared asset does not end in .apk."
            exit 1
          fi
          ASSET_NAME="$(basename "$PREPARED_APK")"
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be exactly app-debug.apk, got '$ASSET_NAME'."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
          - This is an automatically generated debug APK.
          - The APK was built by GitHub Actions.
          - GitHub Actions run number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - APK is intended for testing.
          - APK is not a Play Store production release.
          - APK is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$PREPARED_APK" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "$RELEASE_NOTES"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          BUILD_OUTCOME: ${{ steps.verify_apk.outcome }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Filename: app-debug.apk"
            echo "Direct APK URL: $DIRECT_URL"
            echo "Actions backup artifact 'app-debug-apk' remains available."

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "- **Direct APK URL:** ${DIRECT_URL}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_URL}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup Artifact:** Normal Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed (outcome: ${RELEASE_OUTCOME})."
            if [ "$BUILD_OUTCOME" = "success" ] && [ "$UPLOAD_OUTCOME" = "success" ]; then
              echo "The debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
              {
                echo "## GitHub Release Warning"
                echo ""
                echo "GitHub Release publishing failed, so the new APK is **not** available at the direct latest-release link."
                echo "However, the debug APK build succeeded and the Actions artifact \`app-debug-apk\` remains available."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "The APK build or artifact upload did not complete successfully."
            fi
          fi
